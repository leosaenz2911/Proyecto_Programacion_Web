<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Acuerdos - Tablón ULima</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css_historia1.css"> 
    <link rel="stylesheet" href="estilosH4.css"> 
</head>
<body>
    <header class="topbar">
        <div class="topbar-main">
            <a class="brand">
                <img class="brand-logo" src="img/logo_ulima.png" alt="" onerror="this.style.display='none'">
                <span>Tablón ULima</span>
            </a>
            <nav class="nav-links">
                <a href="#">Catálogo</a>
                <a href="#">Cómo funciona</a>
                <a href="#">Normas del tablón</a>
                <a href="#">Ayuda</a>
            </nav>
            <div class="nav-right">
                <span class="role-badge role-visitante" style="background:#DD6B20; color:white; padding:4px 10px; border-radius:12px; font-size:0.75rem; font-weight:bold;">USUARIO</span>
                <div>
                    <a class="user-chip" style="display:flex; align-items:center; gap:8px; font-weight:bold; cursor:pointer;">
                        <span class="avatar-sm" style="background:#E2E8F0; padding:6px 8px; border-radius:50%;">DV</span>
                        <span>Diego Vargas ▾</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <nav class="main-nav">
        <ul>
            <li><a href="#">Catálogo</a></li>
            <li><a href="#">Mis publicaciones</a></li>
            <li><a href="#">Favoritos</a></li>
            <li><a href="#">Ofertas</a></li>
            <li><a href="#" class="active">Acuerdos</a></li>
        </ul>
    </nav>

    <main class="content-container" style="margin-top: 24px;">
        <h1 class="page-title">Mis Acuerdos de Entrega</h1>
        
        <div class="filter-bar">
            <div class="filter-pills" id="pillsAcuerdos">
                <button class="pill active" onclick="filtrarAcuerdos('Todos')">Todos</button>
                <button class="pill" onclick="filtrarAcuerdos('Pendiente')">Pendientes</button>
                <button class="pill" onclick="filtrarAcuerdos('Acordado')">Acordados</button>
                <button class="pill" onclick="filtrarAcuerdos('Entregado')">Entregados</button>
                <button class="pill" onclick="filtrarAcuerdos('Cancelado')">Cancelados</button>
            </div>
        </div>

        <div id="listaAcuerdos" class="sent-offers-list">
        </div>
    </main>

    <div id="modalAcuerdo" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitulo">Gestionar Acuerdo</h3>
                <button class="close-modal-btn" onclick="cerrarModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="product-preview-box">
                    <div class="pink-square"></div>
                    <div>
                        <h4 id="modalProducto">Nombre del producto</h4>
                        <p id="modalInfo">Monto: S/ 0.00</p>
                    </div>
                </div>
                <div id="modalContenidoDinamico"></div>
            </div>
            <div class="modal-footer" id="modalBotones">
            </div>
        </div>
    </div>

    <script src="script_acuerdos.js"></script>
</body>
</html>
